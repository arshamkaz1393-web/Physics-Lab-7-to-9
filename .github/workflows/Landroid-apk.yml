name: Build Physics Lab APK

on: workflow_dispatch: push: branches: - main

jobs: build: runs-on: ubuntu-latest

steps:

\- name: Checkout uses: actions/checkout@v4

\- name: Setup Java uses: actions/setup-java@v4 with: distribution: temurin java-version: '17'

\- name: Setup Android uses: android-actions/setup-android@v3

\- name: Create Android project run: | mkdir -p app/src/main/assets mkdir -p app/src/main/java/com/physicslab/app

cp index.html app/src/main/assets/index.html

cat > settings.gradle
